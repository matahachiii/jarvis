# =============================================================
# Jarvis configuration
# Change settings here, never in the code.
# =============================================================

[jarvis]
name = "Jarvis"
user_name = "Anwar"
personality_file = "config/personality.md"

[brain]
# Which brain to use:
#   "ollama"            -> local model via Ollama (free, private, offline)
#   "openai_compatible" -> free-tier cloud API (faster/smarter, needs internet + API key)
provider = "ollama"

# Thinking mode: the model reasons step by step before answering.
# More accurate on multi-step questions, but adds seconds of delay.
think = false

# Creativity of the answers (0 = deterministic, 1 = creative)
temperature = 0.6

# Context window in tokens. Smaller = less RAM, but shorter memory per conversation.
context_length = 4096


# Maximum length of one answer in tokens (safety brake).
# Also reserved in the context window, so the answer always fits.
max_tokens = 512

[brain.ollama]
model = "qwen3:4b-instruct-2507-q4_K_M"
host = "http://localhost:11434"
# How long the model stays loaded in RAM after the last request
keep_alive = "10m"

[brain.cloud]
# Any OpenAI-compatible API (Groq, Gemini, OpenRouter, ...). Filled in later.
base_url = ""
model = ""
# Name of the environment variable in .env that holds the API key
api_key_env = "JARVIS_CLOUD_API_KEY"


[voice]
# Phase 3: voice. Engines chosen in the step 1 benchmark (bench_stt.py, bench_tts.py).

[voice.stt]
# Which speech-to-text engine to use:
#   "faster-whisper" -> Whisper on the CPU (default: WER 4.6%, 0.30 s per phrase, +74 MB)
#   "apple"          -> macOS on-device recognition (WER 1.5%, 0.11 s, +212 MB in a macOS service)
engine = "faster-whisper"
model = "base.en"          # faster-whisper model size
language = "en"
[voice.tts]
# Which text-to-speech engine to use (one line to switch):
#   "kokoro" -> Kokoro v1.0 int8 (default: ear 5/5, +114 MB, ~0.2 s per second of speech)
#   "piper"  -> Piper alan (plan B: ear 3/5, +171 MB, 0.14 s per sentence)
# Kokoro condition (step 6): key release -> first audio <= 1.5 s median, else switch to "piper".
engine = "kokoro"

[voice.tts.kokoro]
model = "data/models/kokoro/kokoro-v1.0.int8.onnx"   # relative to the project folder
voices = "data/models/kokoro/voices-v1.0.bin"
voice = "bm_george"        # other British male voices in the same file: bm_lewis, bm_daniel, bm_fable
lang = "en-gb"
speed = 1.0
lean = true                # ONNX Runtime without memory arena: 366 -> 114 MB, a bit slower

[voice.tts.piper]
voice = "en_GB-alan-medium"
